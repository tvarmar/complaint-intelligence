[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complaint-intelligence"
version = "0.1.0"
description = "Reproducible NLP pipelines for consumer financial complaint classification"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jupyterlab",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]